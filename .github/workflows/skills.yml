name: Skills maintenance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * *"
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 1 * *'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate skill packages
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate_skills.py

      - name: Report skill health
        run: python3 skills/skill-doctor/scripts/skill_doctor.py --output "$GITHUB_STEP_SUMMARY"

      - name: Check upstream overrides are applied
        run: |
          for dir in upstreams/*/; do
            [[ -f "$dir/source.json" ]] && python3 scripts/sync_upstream.py apply-overrides "$(basename "$dir")"
          done
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Lint installer
        run: shellcheck install.sh

      - name: Exercise installer in a scratch home
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.claude/skills/research" "$HOME/.agents/skills/machine-only"
          ./install.sh
          ./install.sh
          test ! -L "$HOME/.claude/skills/research" && test -d "$HOME/.agents/skills/machine-only"
          ./install.sh --all
          grep -qx -- --all "${XDG_CONFIG_HOME:-$HOME/.config}/portable-skills/install-flags"
          ./install.sh --force
          test -L "$HOME/.claude/skills/research" && test -L "$HOME/.agents/skills/document-editing"
          ./install.sh --defaults
          test ! -e "$HOME/.agents/skills/document-editing"
          rmdir "$HOME/.agents/skills/machine-only"
          ./install.sh --uninstall
          test -z "$(find "$HOME/.agents/skills" "$HOME/.claude/skills" "$HOME/.claude/agents" -mindepth 1 -maxdepth 1)"
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 7 * * *'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        upstream: [harvard-tooluniverse, kepano-obsidian-skills]
    concurrency:
      group: sync-upstream-${{ matrix.upstream }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch upstream catalog
        id: upstream
        shell: bash
        env:
          KEY: ${{ matrix.upstream }}
        run: |
          set -euo pipefail
          repository="$(jq -r .repository "upstreams/$KEY/source.json")"
          skills_path="$(jq -r .skills_path "upstreams/$KEY/source.json")"
          source_dir="$RUNNER_TEMP/$KEY"
          git clone --depth=1 --filter=blob:none --sparse "$repository.git" "$source_dir"
          git -C "$source_dir" sparse-checkout set "$skills_path"
          echo "source_dir=$source_dir" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git -C "$source_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Open a review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ matrix.upstream }}
          SOURCE_DIR: ${{ steps.upstream.outputs.source_dir }}
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
          REPOSITORY: ${{ steps.upstream.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          prefix="automation/${KEY}-sync-"
          branch="${prefix}${SOURCE_SHA:0:12}"

          open_sync_prs="$(gh pr list --state open --limit 100 --base "$base" --json headRefName --jq "[.[] | select(.headRefName | startswith(\"$prefix\"))] | length")"
          if [[ "$open_sync_prs" != "0" ]]; then
            echo "A $KEY sync PR is already open; leaving this update for the next run."
            exit 0
          fi

          git fetch origin "$base:refs/remotes/origin/$base"
          git checkout --detach "origin/$base"
          python3 scripts/sync_upstream.py sync "$KEY" "$SOURCE_DIR" "$SOURCE_SHA"
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate_skills.py
          git add -A skills/ upstreams/ third-party-licenses/ README.md
          if git diff --cached --quiet; then
            echo "The mirrored $KEY catalog already matches upstream."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "The source-revision branch already exists. Review it before retrying: $branch" >&2
            exit 1
          fi

          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync $KEY skills"
          git push origin "$branch"
          gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "chore: sync $KEY skills" \
            --body "Updates the mirrored skills from [$REPOSITORY]($REPOSITORY/tree/$SOURCE_SHA). Local overrides in \`upstreams/$KEY/\` were re-applied and the catalog passed validation. Review before merging. Upstream removals and changes to files with local overrides stop the sync for manual review; this workflow does not delete skills, force-push, or merge automatically."

  sync-system-design:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 7 * * *'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    concurrency:
      group: sync-system-design-upstream
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch upstream skill
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          source="https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/main/engineering/skills/system-design/SKILL.md"
          upstream_file="$(mktemp)"
          trap 'rm -f "$upstream_file"' EXIT

          curl --fail --silent --show-error --location --retry 3 "$source" --output "$upstream_file"
          grep --fixed-strings --line-regexp --quiet 'name: system-design' "$upstream_file"
          grep --fixed-strings --line-regexp --quiet '# System Design' "$upstream_file"
          cp "$upstream_file" "$RUNNER_TEMP/system-design-upstream.md"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Open or update an upstream sync pull request
        if: steps.upstream.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/sync-system-design-upstream"
          base="${{ github.event.repository.default_branch }}"
          target="skills/system-design/SKILL.md"
          source_file="$RUNNER_TEMP/system-design-upstream.md"

          git fetch origin "$base:refs/remotes/origin/$base"
          git checkout --force --detach "origin/$base"
          git checkout -B "$branch"
          cp "$source_file" "$target"
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate_skills.py
          git add "$target"

          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if git diff --cached --quiet; then
            if [[ -n "$existing_pr" ]]; then
              gh pr close "$existing_pr" --comment "The upstream skill now matches the default branch."
            fi
            echo "No upstream skill changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream system-design skill"

          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          else
            git push origin "$branch"
          fi

          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "chore: sync upstream system-design skill" \
              --body "Updates skills/system-design/SKILL.md from [Anthropic's upstream skill](https://github.com/anthropics/knowledge-work-plugins/blob/main/engineering/skills/system-design/SKILL.md). The repository validator passed; review the upstream changes before merging."
          fi
