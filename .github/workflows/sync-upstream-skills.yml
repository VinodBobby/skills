name: Sync upstream skill catalogs

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        upstream: [harvard-tooluniverse, kepano-obsidian-skills]
    concurrency:
      group: sync-upstream-${{ matrix.upstream }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch upstream catalog
        id: upstream
        shell: bash
        env:
          KEY: ${{ matrix.upstream }}
        run: |
          set -euo pipefail
          repository="$(jq -r .repository "upstreams/$KEY/source.json")"
          skills_path="$(jq -r .skills_path "upstreams/$KEY/source.json")"
          source_dir="$RUNNER_TEMP/$KEY"
          git clone --depth=1 --filter=blob:none --sparse "$repository.git" "$source_dir"
          git -C "$source_dir" sparse-checkout set "$skills_path"
          echo "source_dir=$source_dir" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git -C "$source_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"

      - name: Open a review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ matrix.upstream }}
          SOURCE_DIR: ${{ steps.upstream.outputs.source_dir }}
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
          REPOSITORY: ${{ steps.upstream.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          prefix="automation/${KEY}-sync-"
          branch="${prefix}${SOURCE_SHA:0:12}"

          open_sync_prs="$(gh pr list --state open --limit 100 --base "$base" --json headRefName --jq "[.[] | select(.headRefName | startswith(\"$prefix\"))] | length")"
          if [[ "$open_sync_prs" != "0" ]]; then
            echo "A $KEY sync PR is already open; leaving this update for the next run."
            exit 0
          fi

          git fetch origin "$base:refs/remotes/origin/$base"
          git checkout --detach "origin/$base"
          python3 scripts/sync_upstream.py sync "$KEY" "$SOURCE_DIR" "$SOURCE_SHA"
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate_skills.py
          git add -A skills/ upstreams/ third-party-licenses/ README.md
          if git diff --cached --quiet; then
            echo "The mirrored $KEY catalog already matches upstream."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "The source-revision branch already exists. Review it before retrying: $branch" >&2
            exit 1
          fi

          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync $KEY skills"
          git push origin "$branch"
          gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "chore: sync $KEY skills" \
            --body "Updates the mirrored skills from [$REPOSITORY]($REPOSITORY/tree/$SOURCE_SHA). Local overrides in \`upstreams/$KEY/\` were re-applied and the catalog passed validation. Review before merging. Upstream removals and changes to files with local overrides stop the sync for manual review; this workflow does not delete skills, force-push, or merge automatically."
